<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#g)"/>
  <text x="400" y="40" text-anchor="middle" fill="#38bdf8" font-size="22" font-family="monospace" font-weight="bold">A3M Biosemiotic Routing</text>
  <text x="400" y="65" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="monospace">Like the immune system: route resources by threat level</text>
  <!-- nodes -->
  <g font-family="monospace" font-size="11" fill="#e2e8f0">
    <circle cx="120" cy="130" r="28" fill="#22c55e" opacity="0.9">
      <animate attributeName="r" values="28;34;28" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="120" y="134" text-anchor="middle" fill="#0f172a">Groq</text>
    <circle cx="260" cy="130" r="24" fill="#3b82f6" opacity="0.9">
      <animate attributeName="r" values="24;30;24" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="260" y="134" text-anchor="middle" fill="#0f172a">Mistral</text>
    <circle cx="400" cy="130" r="30" fill="#a855f7" opacity="0.9">
      <animate attributeName="r" values="30;36;30" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="134" text-anchor="middle" fill="#0f172a">DeepSeek</text>
    <circle cx="540" cy="130" r="22" fill="#f59e0b" opacity="0.9">
      <animate attributeName="r" values="22;28;22" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="540" y="134" text-anchor="middle" fill="#0f172a">GPT-4o</text>
    <circle cx="680" cy="130" r="20" fill="#ef4444" opacity="0.9">
      <animate attributeName="r" values="20;26;20" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="680" y="134" text-anchor="middle" fill="#0f172a">Claude</text>
  </g>
  <!-- flow line -->
  <path d="M 60 130 L 740 130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="400" y="180" text-anchor="middle" fill="#64748b" font-size="10" font-family="monospace">Simple query → cheapest capable provider · Complex reasoning → premium model</text>
</svg>
